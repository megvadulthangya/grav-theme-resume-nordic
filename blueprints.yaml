name: Nord Resume
slug: resume-nordic
type: theme
version: 1.0.0
description: "A modern resume theme."
icon: user-secret
author:
  name: Gyöngyösi Gábor
  email: gyongyosigabor@gshoots.hu
homepage: https://github.com/megvadulthangya/grav-theme-resume-nordic
demo: https://nordic-skeleton.gshoots.hu
license: MIT

dependencies:
  - { name: grav, version: '>=1.7.0' }

form:
  validation: loose
  fields:
    gravatar_enabled:
        type: toggle
        label: Enable Gravatar
        highlight: 1
        default: 1
        options:
          1: PLUGIN_ADMIN.ENABLED
          0: PLUGIN_ADMIN.DISABLED
        validate:
          type: bool

    gravatar_size:
        type: range
        label: Avatar Size (px)
        default: 100
        min: 50
        max: 300
        step: 10
        validate:
          type: number

    footer_text:
        type: text
        label: Custom Footer Text
