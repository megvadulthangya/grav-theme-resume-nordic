name: Nord Resume
slug: resume-nordic
type: theme
version: 1.0.0
description: "A modern resume theme."
icon: user-secret
author:
  name: Gyöngyösi Gábor
  email: gyongyosigabor@gshoots.hu
homepage: https://github.com/megvadulthangya/grav-theme-resume-nordic
demo: https://nordic-skeleton.gshoots.hu
license: MIT

dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: error }
  - { name: problems }

form:
  validation: loose
  fields:
    section_avatar:
        type: section
        title: Avatar Settings
        underline: true
    
    gravatar_email:
        type: email
        label: Gravatar Email
        help: "Override the global site email for the profile picture. If empty, the site default is used."
        placeholder: "example@gmail.com"

    gravatar_enabled:
        type: toggle
        label: Enable Gravatar
        highlight: 1
        default: 1
        options:
          1: PLUGIN_ADMIN.ENABLED
          0: PLUGIN_ADMIN.DISABLED
        validate:
          type: bool

    gravatar_size:
        type: range
        label: Avatar Size (px)
        default: 200
        min: 50
        max: 500
        step: 10
        help: "Diameter of the profile picture in pixels. (Default: 200px)"
        validate:
          min: 50
          max: 500
          type: number

    section_footer:
        type: section
        title: Footer Settings
        underline: true

    footer_text:
        type: text
        label: Custom Footer Name
        help: "The date (© 2025) is automatic! Enter only your Name or Company. If empty, 'Site Title' is used."
        placeholder: "e.g. My Company Ltd."

    hide_credits:
        type: toggle
        label: Hide Credits
        highlight: 0
        default: 0
        options:
          1: PLUGIN_ADMIN.YES
          0: PLUGIN_ADMIN.NO
        validate:
          type: bool
